<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZAS-TECH COMPANY — Work</title>
  <meta name="description" content="Everything ZAS-TECH COMPANY has built — systems, web apps, websites, mobile apps and designs." />
  <meta property="og:title" content="ZAS-TECH COMPANY — Work" />
  <meta property="og:description" content="Everything we have built." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0b0c0f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23c8f23a'/><text x='50%25' y='56%25' font-family='Arial' font-weight='800' font-size='34' text-anchor='middle' dominant-baseline='middle' fill='%230b0c0f'>Z</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try {
      const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
      if (localStorage.getItem('lang') === 'ku') { document.documentElement.lang = 'ckb'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>

  <header class="nav" id="nav">
    <div class="wrap nav-in">
      <a class="brand" href="#top" aria-label="Home">
        <span class="brand-mark">Z</span>
        <span class="brand-name" data-bind="name">ZAS-TECH COMPANY</span>
      </a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#work" data-i18n="nav.work">Work</a>
        <a href="#contact" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="nav-tools">
        <button class="chip-btn" id="langBtn" type="button" aria-label="Switch language"><span data-i18n="lang.switch">کوردی</span></button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <div class="hero-grid">
        <div class="hero-copy">
          <p class="eyebrow"><span class="dot"></span><span data-i18n="hero.available">Available for new projects</span></p>
          <h1 class="hero-title">
            <span data-i18n="hero.t1">What we’ve</span>
            <em data-i18n="hero.t2">built.</em>
          </h1>
          <p class="hero-bio" data-bind="bio"></p>
          <div class="hero-cta">
            <a class="btn btn-primary" href="#work"><span data-i18n="hero.cta">See the work</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></a>
            <a class="btn btn-ghost" href="#contact" data-i18n="hero.contact">Get in touch</a>
          </div>
        </div>
        <aside class="hero-card" aria-label="Profile">
          <div class="profile">
            <img class="avatar" data-bind="avatar" alt="" width="64" height="64" />
            <div>
              <div class="p-name" data-bind="name">ZAS-TECH COMPANY</div>
              <div class="p-role" data-bind="role"></div>
              <div class="p-loc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-bind="location"></span></div>
            </div>
          </div>
          <dl class="stats">
            <div><dt data-i18n="stat.projects">Projects</dt><dd data-stat="projects">—</dd></div>
            <div><dt data-i18n="stat.commits">Commits</dt><dd data-stat="commits">—</dd></div>
          </dl>
        </aside>
      </div>
      <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>
    </section>

    <section class="section wrap" id="work">
      <div class="section-head">
        <p class="kicker">01</p>
        <h2 data-i18n="work.title">Projects</h2>
      </div>
      <div class="filters" id="filters" role="tablist" aria-label="Filter projects"></div>
      <div class="index" id="index"></div>
    </section>

    <section class="section wrap contact" id="contact">
      <p class="kicker">02</p>
      <h2 class="contact-title"><span data-i18n="contact.t1">Have a project in mind?</span> <em data-i18n="contact.t2">Let’s build it.</em></h2>
      <div class="contact-links" id="contactLinks"></div>
    </section>
  </main>

  <footer class="foot wrap">
    <span>© <span id="year"></span> <span data-bind="name">ZAS-TECH COMPANY</span></span>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
