<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found</title>
  <style>
    :root { --bg: #0b0c0f; --text: #eeeef0; --muted: #8d919b; --accent: #c8f23a; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #f5f4ef; --text: #121317; --muted: #5f636c; color-scheme: light; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 16px; }
    h1 { font-size: 64px; margin: 0; letter-spacing: -0.04em; }
    p { color: var(--muted); }
    a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: #0b0c0f; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page moved or never existed. / ئەم پەڕەیە بوونی نییە.</p>
    <a href="/">Back to the work</a>
  </main>
</body>
</html>
