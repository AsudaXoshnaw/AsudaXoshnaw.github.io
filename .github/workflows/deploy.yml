name: Rebuild showcase

# Rebuilds every day so new repos, commits and screenshots appear on their own,
# then publishes site/ to the gh-pages branch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Fine-grained personal access token with read-only "Contents" + "Metadata" on all your repos.
      # Settings → Secrets and variables → Actions → New repository secret → SHOWCASE_TOKEN
      GH_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      SHOWCASE_REPO: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check SHOWCASE_TOKEN
        if: env.GH_TOKEN == ''
        run: echo "::warning::Add the SHOWCASE_TOKEN secret (see README) — skipping the rebuild until then."

      - uses: actions/checkout@v4
        if: env.GH_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.GH_TOKEN != ''
        with:
          node-version: 22

      - name: Cache npm downloads
        if: env.GH_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install tools
        if: env.GH_TOKEN != ''
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Sync GitHub data
        if: env.GH_TOKEN != ''
        run: node scripts/sync-github.mjs

      - name: Build live demos
        if: env.GH_TOKEN != ''
        run: node scripts/build-demos.mjs

      - name: Take screenshots
        if: env.GH_TOKEN != ''
        run: node scripts/screenshots.mjs

      - name: Publish to gh-pages
        if: env.GH_TOKEN != ''
        run: node scripts/deploy.mjs
