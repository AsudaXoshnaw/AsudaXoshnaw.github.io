name: Update showcase

# Re-reads the repo list every day so new projects appear on their own,
# then publishes site/ to the gh-pages branch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Fine-grained personal access token with read-only "Metadata" on all your repos,
      # so private repos are listed too (their code is never read).
      # Settings → Secrets and variables → Actions → New repository secret → SHOWCASE_TOKEN
      GH_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      SHOWCASE_REPO: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check SHOWCASE_TOKEN
        if: env.GH_TOKEN == ''
        run: echo "::warning::Add the SHOWCASE_TOKEN secret (see README) — skipping the update until then."

      - uses: actions/checkout@v4
        if: env.GH_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.GH_TOKEN != ''
        with:
          node-version: 22

      - name: Sync GitHub data
        if: env.GH_TOKEN != ''
        run: node scripts/sync-github.mjs

      - name: Publish to gh-pages
        if: env.GH_TOKEN != ''
        run: node scripts/deploy.mjs
